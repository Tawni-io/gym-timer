; Tawni — Gym Timer (LILYGO T-Display C5)

[platformio]
default_envs = bringup
boards_dir = boards

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = Lilygo-T-Display-C5
framework = arduino
monitor_speed = 115200
; Avoid USB-CDC reset when opening the serial monitor (ESP32-C5).
monitor_rts = 0
monitor_dtr = 0
upload_speed = 460800
lib_deps =
  lvgl/lvgl@9.2.0
  ; CST816S: vendored LilyGO fork in lib/CST816S (skip Registry fbiego)
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DLV_CONF_INCLUDE_SIMPLE
  -Iinclude
  -Isrc
  ; CST816S swipe (optional CTP). Set 0 to compile out.
  -DUSE_TOUCH_SWIPE=1
  ; Task WDT panic after hang (ms). Set 0 to disable.
  -DC5_TASK_WDT_MS=12000
  ; Timer face: 0 = default cabin face, 1 = classic rollback
  -DTIMER_FACE_CLASSIC=0
monitor_filters = esp32_exception_decoder
; Strip C:/Users/<host>/... from __FILE__ in every env. Public images are
; release-only (GitHub, SoftAP, USB that leaves the bench) — no -ggdb2.
extra_scripts = pre:tools/pio_strip_host_paths.py

[env:bringup]
; Gym / stretching timer (stopwatch + countdown).
; Hard rule: public firmware is build_type=release (script refuses debug here).
build_type = release
build_src_filter = +<*> -<touch_stock_main.cpp>
build_flags =
  ${env.build_flags}
  -DCORE_DEBUG_LEVEL=1
  -DTAWNI_GYM_VERSION=\"0.5.5\"

[env:bringup_touch]
; Gold-standard CST816S acceptance test (src/touch_stock_main.cpp).
;   pio run -e bringup_touch -t upload
;   pio device monitor -e bringup_touch
; Pass: gesture/XY prints + int_edges rises while touching.
extends = env
build_src_filter = +<touch_stock_main.cpp>
lib_deps =
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -Iinclude
  -DUSE_TOUCH_SWIPE=1
  -DCORE_DEBUG_LEVEL=1
